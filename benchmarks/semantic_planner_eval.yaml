version: 1

# Expected values are semantic IR only. These utterances are intentionally not
# consumed as a Tier-0 phrase table by production code.
plans:
  self_identity:
    operation: resolve_reference
    subject: {kind: self, entity_type: person}
  assistant_identity:
    operation: resolve_reference
    subject: {kind: assistant, entity_type: person}
  household_list:
    operation: select
    subject: &members
      kind: current_household
      entity_type: address
      path: [{relation: member}]
  household_count:
    operation: count
    subject: *members
  oldest_member:
    operation: argmin
    subject: *members
    property: birth_date
  youngest_member:
    operation: argmax
    subject: *members
    property: birth_date
  adult_count:
    operation: count
    subject: *members
    filters: [{predicate: adult}]
  minor_count:
    operation: count
    subject: *members
    filters: [{predicate: minor}]
  wife_identity:
    operation: resolve_reference
    subject: &wife
      kind: self
      entity_type: person
      path:
        - relation: spouse
          filters: [{property: gender, value: female}]
  spouse_identity:
    operation: resolve_reference
    subject: &spouse
      kind: self
      entity_type: person
      path: [{relation: spouse}]
  wife_birth_date:
    operation: select
    subject: *wife
    property: birth_date
  spouse_birth_date:
    operation: select
    subject: *spouse
    property: birth_date
  marriage_start:
    operation: select
    subject: *spouse
    property: start_date
    property_source: relationship
  marriage_duration:
    operation: duration
    subject: *spouse
    property: start_date
    property_source: relationship
    mode: days
  son_identity:
    operation: resolve_reference
    subject: &son
      kind: self
      entity_type: person
      path:
        - relation: child
          filters: [{property: gender, value: male}]
  daughter_identity:
    operation: resolve_reference
    subject:
      kind: self
      entity_type: person
      path:
        - relation: child
          filters: [{property: gender, value: female}]
  daughter_given_name:
    operation: select
    subject:
      kind: self
      entity_type: person
      path:
        - relation: child
          filters: [{property: gender, value: female}]
    property: given_name
  son_birth_date:
    operation: select
    subject: *son
    property: birth_date
  son_given_name:
    operation: select
    subject: *son
    property: given_name
  male_children:
    operation: select
    subject:
      kind: self
      entity_type: person
      path: [{relation: child}]
    filters: [{property: gender, value: male}]
  son_birthday_countdown:
    operation: annual_occurrence
    subject: *son
    property: birth_date
    mode: days
  named_dylan_birthday_countdown:
    operation: annual_occurrence
    subject: {kind: named_entity, value: 德伦, entity_type: person}
    property: birth_date
    mode: days
  father_in_law:
    operation: resolve_reference
    subject:
      kind: self
      entity_type: person
      path:
        - {relation: spouse}
        - relation: parent
          filters: [{property: gender, value: male}]
  wife_father:
    operation: resolve_reference
    subject: &wife_father
      kind: self
      entity_type: person
      path:
        - relation: spouse
          filters: [{property: gender, value: female}]
        - relation: parent
          filters: [{property: gender, value: male}]
  wife_father_given_name:
    operation: select
    subject: *wife_father
    property: given_name
  residence_address:
    operation: select
    subject:
      kind: self
      entity_type: person
      path: [{relation: residence}]
    property: full_address
  named_dylan_identity:
    operation: resolve_reference
    subject: {kind: named_entity, value: 匡德伦, entity_type: person}
  pairwise_older_wife:
    operation: argmin
    subject: {kind: self, entity_type: person}
    other: *wife
    property: birth_date
  pairwise_older_spouse:
    operation: argmin
    subject: {kind: self, entity_type: person}
    other: *spouse
    property: birth_date

# 20-question Tier-1 probe. Utterances are scored by stable case id, not
# punctuation-stripped lookup. Result expectations are for the JSON household
# graph at frozen_time with default_speaker_id. given_name is the deployed
# first_name field. Duration/countdown day counts use calendar dates only.
probe:
  frozen_time: "2026-09-03T12:00:00-07:00"
  default_speaker_id: person:jian_kuang
  household_id: address:fort_cerritos
  cases:
    - id: youngest_za_paraphrase
      utterance: 咱家最晚出生的是谁？
      plan: youngest_member
      expected_status: found
      expected_entity_ids: [person:evelyn_kuang]
    - id: adult_count_paraphrase
      utterance: 家里已经成年的有多少位？
      plan: adult_count
      expected_status: found
      expected_value: 3
    - id: father_in_law_lover_dad
      utterance: 我爱人的爸爸是谁？
      plan: father_in_law
      expected_status: found
      expected_entity_ids: [person:zhigang_ba]
    - id: named_dylan_birthday_countdown
      utterance: 德伦再过多久过生日？
      plan: named_dylan_birthday_countdown
      expected_status: found
      expected_entity_ids: [person:dylan_kuang]
      expected_value: 57
      notes: "Days from 2026-09-03 to 2026-10-30. Alias 德伦 -> person:dylan_kuang."
    - id: marriage_duration_wife
      utterance: 我和我老婆结婚多久了？
      plan: marriage_duration
      expected_status: found
      expected_entity_ids: [person:pu_ba]
      expected_value: 4505
      notes: "Days from spouse_of.start 2014-05-04 to frozen 2026-09-03."
    - id: wife_birth_date
      utterance: 我老婆生日是哪天
      plan: wife_birth_date
      expected_status: found
      expected_entity_ids: [person:pu_ba]
      expected_value: "1988-02-26"
    - id: son_birth_date
      utterance: 我儿子哪天出生
      plan: son_birth_date
      expected_status: found
      expected_entity_ids: [person:dylan_kuang]
      expected_value: "2016-10-30"
    - id: oldest_member
      utterance: 家里最年长的是谁
      plan: oldest_member
      expected_status: found
      expected_entity_ids: [person:zhigang_ba]
    - id: minor_count
      utterance: 有几个孩子
      plan: minor_count
      expected_status: found
      expected_value: 2
    - id: father_in_law
      utterance: 我岳父是谁
      plan: father_in_law
      expected_status: found
      expected_entity_ids: [person:zhigang_ba]
    - id: residence_address
      utterance: 我家住哪里
      plan: residence_address
      expected_status: found
      expected_value:
        street: 12745 Droxford St
        city: Cerritos
        state: CA
        zip: "90703"
    - id: pairwise_older_wife
      utterance: 我和我老婆谁年龄大
      plan: pairwise_older_wife
      acceptable_plans: [pairwise_older_spouse]
      expected_status: found
      expected_entity_ids: [person:pu_ba]
      expected_equal: false
      notes: "Older = argmin(birth_date). Pu 1988-02-26 vs Jian 1988-11-11."
    - id: named_dylan_identity
      utterance: 匡德伦是谁
      plan: named_dylan_identity
      expected_status: found
      expected_entity_ids: [person:dylan_kuang]
    - id: daughter_given_name_jian
      utterance: 我的女儿叫什么
      plan: daughter_given_name
      acceptable_plans: [daughter_identity]
      speaker_id: person:jian_kuang
      expected_status: found
      expected_entity_ids: [person:evelyn_kuang]
      expected_value: Evelyn
      expected_names:
        - Evelyn
        - Evelyn Kuang
        - 匡悠然
      notes: >-
        Probe speaker is Jian, not the eval-group speaker zhigang_ba.
        The question asks for the daughter's name. given_name/first_name "Evelyn"
        and identity/display-name output for person:evelyn_kuang with stored names
        Evelyn / Evelyn Kuang / 匡悠然 are both accepted. Wrong person, unrelated
        names, missing values, and non-found statuses remain incorrect.
    - id: marriage_start
      utterance: 我们什么时候结婚的
      plan: marriage_start
      expected_status: found
      expected_entity_ids: [person:pu_ba]
      expected_value: "2014-05-04"
    - id: household_list
      utterance: 请列出家庭成员
      plan: household_list
      expected_status: found
      expected_entity_ids:
        - person:jian_kuang
        - person:pu_ba
        - person:dylan_kuang
        - person:evelyn_kuang
        - person:zhigang_ba
    - id: youngest_member
      utterance: 谁年纪最小
      plan: youngest_member
      expected_status: found
      expected_entity_ids: [person:evelyn_kuang]
    - id: minor_count_under_eighteen
      utterance: 家中未满十八岁的有几位
      plan: minor_count
      expected_status: found
      expected_value: 2
    - id: wife_father_given_name
      utterance: 我妻子的父亲叫什么
      plan: wife_father_given_name
      acceptable_plans: [wife_father]
      expected_status: found
      expected_entity_ids: [person:zhigang_ba]
      expected_value: Zhigang
      notes: "given_name -> first_name on person:zhigang_ba. resolve_reference is an accepted alternative."
    - id: son_birthday_countdown
      utterance: 从今天到我儿子生日相隔几天
      plan: son_birthday_countdown
      expected_status: found
      expected_entity_ids: [person:dylan_kuang]
      expected_value: 57
      notes: "Days from 2026-09-03 to 2026-10-30. This is annual_occurrence mode=days, not date_difference from 2016-10-30."

groups:
  - plan: self_identity
    category: speaker_relative_reference
    utterances:
      - 我是谁
      - 请告诉我我是谁
      - 我的身份是什么
      - 你知道我叫什么吗
      - 当前和你说话的人是谁
      - Who am I?
      - What is my name?
  - plan: assistant_identity
    category: entity_reference
    utterances:
      - 你是谁
      - 您是哪位
      - 你的名字是什么
      - 我该怎么称呼你
      - 这个家庭助理是谁
      - Who are you?
  - plan: daughter_identity
    category: speaker_relative_reference
    speaker_id: person:zhigang_ba
    utterances:
      - 我女儿是谁
      - 请告诉我女儿是哪位
  - plan: daughter_given_name
    acceptable_plans: [daughter_identity]
    category: property_selection
    speaker_id: person:zhigang_ba
    utterances:
      - 我的女儿叫什么
  - plan: household_list
    category: relationship_traversal
    utterances:
      - 家里都有谁
      - 家里都有哪些人
      - 请列出家庭成员
      - 目前住在家中的人有哪些
      - 咱家现在有哪些成员
      - Who is in the household?
  - plan: household_count
    category: aggregation
    utterances:
      - 家里有几个人
      - 家里现在一共多少人
      - 当前家庭成员数量是多少
      - 咱家总共有几位成员
      - 数一下家里的人数
      - How many people are in the household?
  - plan: oldest_member
    category: aggregation
    utterances:
      - 谁最年长
      - 家里最年长的是谁
      - 哪位家庭成员年龄最大
      - 咱家谁岁数最大
      - 谁出生得最早
      - Who is the oldest household member?
  - plan: youngest_member
    category: aggregation
    utterances:
      - 谁最年幼
      - 谁年纪最小
      - 家里最年轻的是谁
      - 咱家岁数最小的是哪一位
      - 最晚出生的是谁
      - 咱家最晚出生的是谁？
      - 家里出生日期最晚的人是谁
      - 咱们家最晚出生的那个人是谁
      - Who is the youngest person at home?
  - plan: adult_count
    category: filtering
    utterances:
      - 有几个成年人
      - 家里成年人有多少
      - 家里已经成年的一共有多少位
      - 家里已经成年的有多少位？
      - 算一下当前成人成员数量
      - 咱家满十八岁的有几人
      - How many adults are in the household?
  - plan: minor_count
    category: filtering
    utterances:
      - 有几个孩子
      - 家里有多少未成年人
      - 现在未成年的有几个
      - 家中未满十八岁的有几位
      - 算一下家里的儿童人数
      - How many minors live at home?
  - plan: wife_identity
    category: relationship_traversal
    utterances:
      - 我老婆是谁
      - 我的妻子是哪位
  - plan: spouse_identity
    category: relationship_traversal
    utterances:
      - 我配偶叫什么
      - 和我结婚的人是谁
      - 我的爱人是谁
      - Who is my spouse?
  - plan: wife_birth_date
    category: property_selection
    utterances:
      - 我老婆生日是哪天
      - 我妻子的出生日期是什么
  - plan: spouse_birth_date
    category: property_selection
    utterances:
      - 我的爱人什么时候出生
      - 配偶的生日是几月几号
      - 和我结婚的人哪天出生
      - When was my spouse born?
  - plan: marriage_start
    category: relationship_property_lookup
    utterances:
      - 我们什么时候结婚的
      - 我们哪天结婚的
      - 我们的结婚日期是什么
      - 我和爱人是哪一年开始做夫妻的
      - 我跟配偶从何时起是夫妻
      - 这段婚姻关系从哪天开始
      - 我和我老婆何时结为夫妻
      - When did my spouse and I get married?
  - plan: marriage_duration
    category: temporal_operation
    utterances:
      - 我们结婚多久了
      - 我和我老婆结婚多久了？
      - 我和配偶已经结婚多少天
      - 我们成为夫妻多长时间了
      - 从结婚到现在过了几天
      - 这段婚姻关系持续多久了
      - How many days have we been married?
  - plan: son_identity
    category: relationship_traversal
    utterances:
      - 我儿子是谁
      - 哪个男孩是我儿子
      - 我家的公子是哪位
      - Who is my son?
  - plan: son_given_name
    acceptable_plans: [son_identity]
    category: property_selection
    utterances:
      - 我的儿子叫什么
  - plan: male_children
    category: relationship_traversal
    utterances:
      - 请找出我的男性子女
  - plan: son_birth_date
    category: property_selection
    utterances:
      - 我儿子哪天出生
      - 我儿子的生日是哪天
      - 儿子的出生日期是什么
      - 我的男性子女何时出生
      - 告诉我儿子的生日
      - When was my son born?
  - plan: son_birthday_countdown
    category: temporal_operation
    utterances:
      - 我儿子的生日还有多少天
      - 距离我儿子生日还有几天
      - 儿子的下次生日要等多少天
      - 从今天到我儿子生日相隔几天
      - 我儿子再过多久过生日
      - How many days until my son's birthday?
  - plan: named_dylan_birthday_countdown
    category: temporal_operation
    utterances:
      - 德伦再过多久过生日
      - 德伦再过多久过生日？
  - plan: father_in_law
    category: multi_hop_kinship
    utterances:
      - 我岳父是谁
      - 我爱人的爸爸是谁
      - 我爱人的爸爸是谁？
      - 配偶的男性家长是哪位
      - Who is my father-in-law?
  - plan: wife_father
    category: multi_hop_kinship
    utterances:
      - 我老婆的爸爸是谁
  - plan: wife_father_given_name
    acceptable_plans: [wife_father]
    category: multi_hop_kinship
    utterances:
      - 我妻子的父亲叫什么
  - plan: residence_address
    category: property_selection
    utterances:
      - 我家住哪里
      - 我的具体住址是什么
      - 告诉我家庭地址
      - 我目前居住地的完整地址是什么
      - 咱家的街道地址在哪里
      - What is my home address?
  - plan: named_dylan_identity
    category: entity_reference
    utterances:
      - 匡德伦是谁
  - plan: pairwise_older_wife
    acceptable_plans: [pairwise_older_spouse]
    category: aggregation
    utterances:
      - 我和我老婆谁年龄大
      - 我老婆和我谁年龄大
