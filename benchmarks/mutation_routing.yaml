  - 把牛奶的位置改成冰箱
  - Move the sketchbook to the studio shelf.
  - 把台灯的颜色改为蓝色。
  - Change the lamp color to blue.
  - 删除台灯的记录
  - Delete the sketchbook record.
  - Preview recording a compass in the study drawer.
  - 预览把指南针记录在书房抽屉里。
