version: 1
plans:
  daughter_identity:
    operation: resolve_reference
    subject:
      kind: self
      entity_type: person
      path:
      - relation: child
        filters:
        - property: gender
          value: female
    property_source: entity
  discourse_birthday_days:
    operation: annual_occurrence
    subject:
      kind: discourse
      entity_type: person
      turn_offset: 1
      cardinality: single
    property: birth_date
    property_source: entity
    mode: days
  discourse_oldest:
    operation: argmin
    subject:
      kind: discourse
      entity_type: person
      turn_offset: 1
      cardinality: collection
    property: birth_date
    property_source: entity
  father:
    operation: resolve_reference
    subject:
      kind: self
      entity_type: person
      path:
      - relation: parent
        filters:
        - property: gender
          value: male
    property_source: entity
  father_in_law:
    operation: resolve_reference
    subject:
      kind: self
      entity_type: person
      path:
      - relation: spouse
      - relation: parent
        filters:
        - property: gender
          value: male
    property_source: entity
  household_adult_count:
    operation: count
    subject:
      kind: current_household
      entity_type: address
      path:
      - relation: member
    property_source: entity
    filters:
    - predicate: adult
  household_adult_female_count:
    operation: count
    subject:
      kind: current_household
      entity_type: address
      path:
      - relation: member
    property_source: entity
    filters:
    - predicate: adult
    - property: gender
      value: female
  household_female_count:
    operation: count
    subject:
      kind: current_household
      entity_type: address
      path:
      - relation: member
    property_source: entity
    filters:
    - property: gender
      value: female
  household_list:
    operation: select
    subject:
      kind: current_household
      entity_type: address
      path:
      - relation: member
    property_source: entity
  household_male_count:
    operation: count
    subject:
      kind: current_household
      entity_type: address
      path:
      - relation: member
    property_source: entity
    filters:
    - property: gender
      value: male
  husband_birth_select:
    operation: select
    subject:
      kind: self
      entity_type: person
      path:
      - relation: spouse
        filters:
        - property: gender
          value: male
    property: birth_date
    property_source: entity
  husband_birthday_days:
    operation: annual_occurrence
    subject:
      kind: self
      entity_type: person
      path:
      - relation: spouse
        filters:
        - property: gender
          value: male
    property: birth_date
    property_source: entity
    mode: days
  self_children_list:
    operation: select
    subject:
      kind: self
      entity_type: person
      path:
      - relation: child
    property_source: entity
forbidden_plans:
  father_then_spouse:
    operation: resolve_reference
    subject:
      kind: self
      entity_type: person
      path:
      - relation: parent
        filters:
        - property: gender
          value: male
      - relation: spouse
    property_source: entity
  household_adult_count:
    operation: count
    subject:
      kind: current_household
      entity_type: address
      path:
      - relation: member
    property_source: entity
    filters:
    - predicate: adult
  household_oldest:
    operation: argmin
    subject:
      kind: current_household
      entity_type: address
      path:
      - relation: member
    property: birth_date
    property_source: entity
  self_member:
    operation: select
    subject:
      kind: self
      entity_type: person
      path:
      - relation: member
    property_source: entity
  wife_birthday_days:
    operation: annual_occurrence
    subject:
      kind: self
      entity_type: person
      path:
      - relation: spouse
        filters:
        - property: gender
          value: female
    property: birth_date
    property_source: entity
    mode: days
sequences:
- id: frz-seq-G1
  household: beta
  speaker_id: person:beta_self
  cell: G1
  notes: Gender after adult on beta so leaked adult count cannot reuse alpha 7.
  turns:
  - utterance: 本户已满十八岁的成员有几位？
    plan: household_adult_count
  - utterance: 本户男性成员有几位？
    plan: household_male_count
    forbidden_plans:
    - household_adult_count
    expected_status: found
    expected_entity_ids:
    - person:beta_husband
    - person:beta_son_minor
    - person:beta_father
    - person:beta_fil
    - person:beta_nephew
    expected_value: 5
  frozen_time: '2026-09-03T12:00:00-07:00'
