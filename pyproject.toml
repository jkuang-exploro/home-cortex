[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "home-cortex"
version = "0.1.0"
description = "Local graph-grounded RAG API for home-cortex"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.116,<1",
    "ollama>=0.6,<1",
    "pydantic-settings>=2.10,<3",
    "pyyaml>=6,<7",
    "jsonschema>=4.23,<5",
    "surrealdb>=2,<3",
    "uvicorn[standard]>=0.35,<1",
    "pytest>=8,<9",
    "pytest-asyncio>=1,<2",
    "httpx2>=2,<3",
]

[project.scripts]
home-cortex-fact-benchmark = "scripts.benchmarks.fact_benchmark:main"
home-cortex-semantic-planner-benchmark = "scripts.benchmarks.semantic_planner_benchmark:main"
home-cortex-db-export = "scripts.maintenance.export_graph:main"

[project.optional-dependencies]
dev = [
    "tiktoken>=0.9,<1",
    "pytest>=8,<9",
    "pytest-asyncio>=1,<2",
    "httpx2>=2,<3",
]

[tool.hatch.build.targets.wheel]
packages = ["src/home_cortex", "scripts"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
