[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "home-media"
version = "0.1.0"
description = "Read-only household photo and video browser"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.116,<1",
    "pillow>=11,<13",
    "pillow-heif>=1,<2",
    "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.28,<1",
    "pytest>=8,<9",
]

[tool.hatch.build.targets.wheel]
packages = ["src/home_media"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

