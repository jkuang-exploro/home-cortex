version: 2

properties:
  display_name:
    label: {en: name, zh: 姓名}
    fields: [display_name, name, full_name]
    aliases: [姓名, 名字, name, display name]
    type: {any_of: [{kind: string}, {kind: collection, items: {kind: string}}]}
    applies_to: {entity: [person], relationship: []}
    filter_operators: [exists]
  given_name:
    label: {en: given name, zh: 名字}
    fields: [given_name, first_name]
    aliases: [名字, given name, first name]
    type: {any_of: [{kind: string}, {kind: collection, items: {kind: string}}]}
    applies_to: {entity: [person], relationship: []}
    filter_operators: [exists]
  family_name:
    label: {en: family name, zh: 姓氏}
    fields: [family_name, last_name, surname]
    aliases: [姓氏, surname, family name, last name]
    type: {any_of: [{kind: string}, {kind: collection, items: {kind: string}}]}
    applies_to: {entity: [person], relationship: []}
    filter_operators: [exists]
  form_of_address:
    label: {en: form of address, zh: 称呼}
    fields: [form_of_address, address_as]
    aliases: [称呼, form of address]
    type: {any_of: [{kind: string}, {kind: collection, items: {kind: string}}, {kind: object}]}
    applies_to: {entity: [person], relationship: []}
    filter_operators: [exists]
  birth_date:
    label: {en: birth date, zh: 出生日期}
    ordering:
      minimum: [年长, 年纪大, 年龄最大, 出生最早, older, oldest, earliest born]
      maximum: [年幼, 年纪小, 年龄最小, 出生最晚, younger, youngest, latest born]
    fields: [birth_date, birthday, dob, date_of_birth]
    aliases: [生日, 出生日期, 出生时间, 哪天出生, birthday, birth date, date of birth, born]
    type: {kind: date}
    applies_to: {entity: [person], relationship: []}
    filter_operators: &ordered_filters [eq, ne, gt, gte, lt, lte, in, exists, date_range]
  full_address:
    label: {en: street address, zh: 具体住址}
    fields: [full_address, address, street_address]
    aliases: [住址, 地址, 街道地址, full address, street address]
    type: {any_of: [{kind: string}, {kind: object}]}
    applies_to: {entity: [address], relationship: []}
    filter_operators: [exists]
  gender:
    label: {en: gender, zh: 性别}
    values:
      female: {aliases: [女, 女性, female], label: {en: female, zh: 女性}}
      male: {aliases: [男, 男性, male], label: {en: male, zh: 男性}}
    fields: [gender, sex]
    aliases: [性别, gender, sex]
    type: {kind: string}
    applies_to: {entity: [person], relationship: []}
    filter_operators: [eq, ne, in, exists]
  household_role:
    label: {en: household role, zh: 家庭角色}
    value_labels:
      owner: {en: owner, zh: 户主}
      adult_dependent: {en: adult dependent, zh: 成年受扶养人}
      minor_dependent: {en: minor dependent, zh: 未成年受扶养人}
    fields: [household_role, member_role, role]
    aliases: [家庭角色, household role]
    type: {kind: string}
    applies_to: {entity: [], relationship: [member, residence]}
    filter_operators: [eq, ne, in, exists]
  start_date:
    label: {en: start date, zh: 开始日期}
    fields: [start, since, start_date]
    aliases: [开始日期, 起始日期, 结婚日期, start date, since]
    type: {kind: date}
    applies_to: {entity: [], relationship: [spouse, child, parent, member, residence]}
    filter_operators: *ordered_filters
  end_date:
    label: {en: end date, zh: 结束日期}
    fields: [end, until, end_date]
    aliases: [结束日期, end date, until]
    type: {kind: date}
    applies_to: {entity: [], relationship: [spouse, child, parent, member, residence]}
    filter_operators: *ordered_filters
  item_type:
    item_writable: string
    label: {en: item type, zh: 物品类型}
    value_labels:
      appliance: {en: appliance, zh: 电器}
      food: {en: food, zh: 食物}
      furniture: {en: furniture, zh: 家具}
      house: {en: house, zh: 房屋}
      tool: {en: tool, zh: 工具}
      book: {en: book, zh: 书籍}
      clothing: {en: clothing, zh: 衣物}
      unknown: {en: unknown, zh: 未知}
    fields: [item_type]
    aliases: [物品类型, 物品类别, 类别, item type, item category, product category]
    type: {kind: string}
    applies_to: {entity: [item], relationship: []}
    filter_operators: [eq, ne, in, exists]
  brand:
    item_writable: string
    label: {en: brand, zh: 品牌}
    fields: [brand]
    aliases: [品牌, brand]
    type: {kind: string}
    applies_to: {entity: [item], relationship: []}
    filter_operators: [eq, ne, in, exists]
  model:
    item_writable: string
    label: {en: model, zh: 型号}
    fields: [model]
    aliases: [型号, model]
    type: {kind: string}
    applies_to: {entity: [item], relationship: []}
    filter_operators: [eq, ne, in, exists]
  color:
    item_writable: string
    label: {en: color, zh: 颜色}
    fields: [color]
    aliases: [颜色, color]
    type: {kind: string}
    applies_to: {entity: [item], relationship: []}
    filter_operators: [eq, ne, in, exists]
  quantity:
    item_writable: number
    write_hint: "Only explicitly stated numeric quantity; do not default to 1 from a/an or a singular noun."
    label: {en: quantity, zh: 数量}
    fields: [quantity]
    aliases: [数量, quantity]
    type: {kind: number}
    applies_to: {entity: [item], relationship: []}
    filter_operators: [eq, ne, gt, gte, lt, lte, in, exists]
  unit:
    item_writable: string
    write_hint: "Only an explicitly supplied counting or measurement unit. No default unit, and do not invent a Chinese measure word for English input."
    label: {en: unit, zh: 单位}
    fields: [unit]
    aliases: [单位, unit]
    type: {kind: string}
    applies_to: {entity: [item], relationship: []}
    filter_operators: [eq, ne, in, exists]
  description:
    item_writable: string
    write_hint: "Only an explicitly supplied description beyond the identifying noun phrase. Never copy the item name, command, or a generated summary into this field."
    label: {en: description, zh: 描述}
    fields: [description]
    aliases: [描述, description]
    type: {kind: string}
    applies_to: {entity: [item], relationship: []}
    filter_operators: [eq, ne, in, exists]
  expiration_date:
    item_writable: date
    label: {en: expiration date, zh: 到期日期}
    fields: [expiration_date]
    aliases: [到期日期, expiration date]
    type: {kind: date}
    applies_to: {entity: [item], relationship: []}
    filter_operators: *ordered_filters
  space_type:
    label: {en: space type, zh: 空间类型}
    value_labels:
      room: {en: room, zh: 房间}
    fields: [space_type, type]
    aliases: [空间类型, 房间类型, space type, room type]
    type: {kind: string}
    applies_to: {entity: [space], relationship: []}
    filter_operators: [eq, ne, in, exists]

policy_values:
  adulthood_years: 18

collection_predicates:
  adult:
    label: {en: adult, zh: 成年人}
    modifier: {en: adult, zh: 成年}
    aliases: [成年人, 成人, adults]
    entity_types: [person]
    default_scope_relation: member
    relation_property: household_role
    recognized_values: [owner, adult_dependent, minor_dependent]
    matching_values: [owner, adult_dependent]
    fallback:
      property: birth_date
      transform: date_difference
      mode: years
      require_past: true
      operator: gte
      value_from_policy: adulthood_years
    disjoint_with: [minor]
  minor:
    label: {en: minor, zh: 未成年人}
    modifier: {en: minor, zh: 未成年}
    aliases: [未成年人, 孩子, 小孩, minors, child]
    entity_types: [person]
    default_scope_relation: member
    relation_property: household_role
    recognized_values: [owner, adult_dependent, minor_dependent]
    matching_values: [minor_dependent]
    fallback:
      property: birth_date
      transform: date_difference
      mode: years
      require_past: true
      operator: lt
      value_from_policy: adulthood_years
    disjoint_with: [adult]

base_relations:
  spouse:
    edge: spouse_of
  child:
    edge: parent_of
  parent:
    edge: child_of
  member:
    edge: has_resident
  residence:
    edge: lives_in
  location:
    edge: located_in
  contents:
    edge: contains
  host:
    edge: hosted_by
  hosted_space:
    edge: hosts_space

reference_concepts:
  member:
    label: {en: household member, zh: 家庭成员}
    count_label: {en: person, zh: 人}
    aliases: [家庭成员, household member, resident]
    path:
      - relation: member
  residence:
    label: {en: residence, zh: 住所}
    aliases: [居住地, 住址, residence, home address]
    path:
      - relation: residence
  location:
    label: {en: location, zh: 所在位置}
    aliases: [位置, 所在地, 在哪里, location, located in, where]
    path:
      - relation: location
  contents:
    label: {en: contained item, zh: 所含物品}
    aliases: [所含物品, 里面的物品, contained item, contents]
    path:
      - relation: contents
  hosted_space:
    label: {en: hosted space, zh: 区域}
    count_label: {en: space, zh: 区域}
    aliases: [区域, 内部空间, 分区, 承载的空间, hosted space, spaces, compartments, sections]
    path:
      - relation: hosted_space
  host:
    label: {en: host, zh: 承载物}
    aliases: [承载物, 由谁承载, 所属容器, host, hosted by, host_by]
    path:
      - relation: host
  room:
    label: {en: room, zh: 房间}
    count_label: {en: room, zh: 房间}
    aliases: [房间, 屋子, room, rooms]
    path:
      - relation: contents
        filters:
          - {property: item_type, value: house}
      - relation: hosted_space
        filters:
          - {property: space_type, value: room}
  spouse:
    label: {en: spouse, zh: 配偶}
    aliases: [配偶, 爱人, spouse, partner]
    path:
      - relation: spouse
  wife:
    aliases: [老婆, 妻子, wife]
    path:
      - relation: spouse
        filters:
          - {property: gender, value: female}
  husband:
    aliases: [老公, 丈夫, husband]
    path:
      - relation: spouse
        filters:
          - {property: gender, value: male}
  child:
    label: {en: child, zh: 子女}
    aliases: [孩子, 小孩, child, children]
    path:
      - relation: child
  son:
    aliases: [儿子, 公子, 男性子女, 男孩后代, son, male child]
    path:
      - relation: child
        filters:
          - {property: gender, value: male}
  daughter:
    aliases: [女儿, 千金, 女性子女, daughter]
    path:
      - relation: child
        filters:
          - {property: gender, value: female}
  parent:
    label: {en: parent, zh: 父母}
    aliases: [父母, parent, parents]
    path:
      - relation: parent
  father:
    aliases: [爸爸, 父亲, 男性家长, father]
    path:
      - relation: parent
        filters:
          - {property: gender, value: male}
  mother:
    aliases: [妈妈, 母亲, mother]
    path:
      - relation: parent
        filters:
          - {property: gender, value: female}
  paternal_grandson:
    aliases: [孙子, paternal grandson]
    path:
      - relation: child
        filters:
          - {property: gender, value: male}
      - relation: child
        filters:
          - {property: gender, value: male}
  maternal_grandson:
    aliases: [外孙, maternal grandson]
    path:
      - relation: child
        filters:
          - {property: gender, value: female}
      - relation: child
        filters:
          - {property: gender, value: male}
  paternal_grandfather:
    aliases: [爷爷, paternal grandfather]
    path:
      - relation: parent
        filters:
          - {property: gender, value: male}
      - relation: parent
        filters:
          - {property: gender, value: male}
  maternal_grandfather:
    aliases: [外公, 姥爷, maternal grandfather]
    path:
      - relation: parent
        filters:
          - {property: gender, value: female}
      - relation: parent
        filters:
          - {property: gender, value: male}
  older_brother:
    aliases: [哥哥, older brother]
    path:
      - relation: parent
      - relation: child
        filters:
          - {property: gender, value: male}
          - {property: birth_date, operator: lt, value_from: anchor}
  father_in_law:
    aliases: [岳父, 公公, father-in-law, father in law]
    path:
      - relation: spouse
      - relation: parent
        filters:
          - {property: gender, value: male}
  mother_in_law:
    aliases: [岳母, 婆婆, mother-in-law, mother in law]
    path:
      - relation: spouse
      - relation: parent
        filters:
          - {property: gender, value: female}
