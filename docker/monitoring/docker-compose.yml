services:
  beszel:
    image: henrygd/beszel:0.18.7
    restart: unless-stopped
    ports:
      - "${BESZEL_PORT:-8090}:8090"
    environment:
      APP_URL: ${BESZEL_APP_URL:-http://localhost:8090}
    volumes:
      - beszel-data:/beszel_data
      - beszel-socket:/beszel_socket
  beszel-agent:
    image: henrygd/beszel-agent:0.18.7
    restart: unless-stopped
    network_mode: host
    environment:
      LISTEN: /beszel_socket/beszel.sock
      HUB_URL: http://localhost:${BESZEL_PORT:-8090}
      KEY: ${BESZEL_AGENT_KEY:?Set BESZEL_AGENT_KEY in docker/monitoring/.env}
      TOKEN: ${BESZEL_AGENT_TOKEN:?Set BESZEL_AGENT_TOKEN in docker/monitoring/.env}
    volumes:
      - beszel-agent-data:/var/lib/beszel-agent
      - beszel-socket:/beszel_socket
      - /var/run/docker.sock:/var/run/docker.sock:ro

volumes:
  beszel-data:
  beszel-agent-data:
  beszel-socket:
