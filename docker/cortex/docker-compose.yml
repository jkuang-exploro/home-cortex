services:
  ollama:
    image: ollama/ollama:0.32.13
    restart: unless-stopped
    gpus: all
    volumes:
      - ollama-data:/root/.ollama
    environment:
      OLLAMA_KEEP_ALIVE: 24h

  open-webui:
    build:
      context: ../..
      dockerfile: docker/cortex/open-webui/Dockerfile
    image: home-cortex/open-webui:v0.9.5-greeting
    restart: unless-stopped
    ports:
      - "3000:8080"
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
      ENABLE_OPENAI_API: "true"
      ENABLE_FORWARD_USER_INFO_HEADERS: "true"
      OPENAI_API_BASE_URLS: http://cortex-api:8000/v1
      OPENAI_API_KEYS: ${CORTEX_API_KEY:-unused}
      CORTEX_INTERNAL_URL: http://cortex-api:8000
      CORTEX_API_KEY: ${CORTEX_API_KEY:-}
      CORTEX_GREETING_AGENT: steward
    volumes:
      - open-webui-data:/app/backend/data
    depends_on:
      - ollama
      - cortex-api

  surrealdb:
    image: surrealdb/surrealdb:v3.0.5
    restart: unless-stopped
    command: start rocksdb:/home/nonroot/home-cortex.db
    environment:
      SURREAL_USER: ${SURREAL_USER}
      SURREAL_PASS: ${SURREAL_PASS}
    volumes:
      - surrealdb-data:/home/nonroot

  cortex-api:
    build:
      context: ../..
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8001:8000"
    environment:
      SURREAL_URL: ws://surrealdb:8000
      SURREAL_USER: ${SURREAL_USER}
      SURREAL_PASS: ${SURREAL_PASS}
      SURREAL_NAMESPACE: home_cortex
      SURREAL_DATABASE: home_cortex
      OLLAMA_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL}
      DATA_DIR: /app/data
      CORTEX_API_KEY: ${CORTEX_API_KEY:-}
      CORTEX_IDENTITY_MAP: '${CORTEX_IDENTITY_MAP:-{}}'
    volumes:
      - ../../data:/app/data:ro
    depends_on:
      - surrealdb
      - ollama

volumes:
  ollama-data:
  open-webui-data:
  surrealdb-data:
