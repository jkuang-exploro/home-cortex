services:
  ollama:
    image: ollama/ollama:0.32.5
    restart: unless-stopped
    gpus: all
    volumes:
      - ollama-data:/root/.ollama

  open-webui:
    image: ghcr.io/open-webui/open-webui:v0.9.5
    restart: unless-stopped
    ports:
      - "3000:8080"
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
    volumes:
      - open-webui-data:/app/backend/data
    depends_on:
      - ollama

  surrealdb:
    image: surrealdb/surrealdb:v3.0.5
    restart: unless-stopped
    command: start rocksdb:/home/nonroot/home-cortex.db
    environment:
      SURREAL_USER: ${SURREAL_USER}
      SURREAL_PASS: ${SURREAL_PASS}
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - surrealdb-data:/home/nonroot

  cortex-api:
    build:
      context: ../..
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8001:8000"
    environment:
      SURREAL_URL: ws://surrealdb:8000
      SURREAL_USER: ${SURREAL_USER}
      SURREAL_PASS: ${SURREAL_PASS}
      SURREAL_NAMESPACE: home_cortex
      SURREAL_DATABASE: home_cortex
      OLLAMA_URL: http://ollama:11434
      DATA_DIR: /app/data
    volumes:
      - ../../data:/app/data:ro
    depends_on:
      - surrealdb
      - ollama

volumes:
  ollama-data:
  open-webui-data:
  surrealdb-data:
